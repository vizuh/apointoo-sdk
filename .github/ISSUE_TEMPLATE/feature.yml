name: Feature request
description: Propose an addition or change
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What can't you do today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Keep it ADR-sized — problem + decision, not full implementation.
    validations:
      required: true
  - type: checkboxes
    id: prereqs
    attributes:
      label: Checklist
      options:
        - label: Searched existing issues
          required: true
        - label: This fits within the scope of the library (adapters + pipeline + core only)
          required: true
