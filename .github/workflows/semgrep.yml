name: Semgrep

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly Monday 06:00 UTC — catches new rules + drift in the codebase
    - cron: '0 6 * * 1'

permissions:
  contents: read
  security-events: write # so SARIF uploads land in the Security tab
  actions: read

jobs:
  semgrep:
    name: Static analysis
    runs-on: ubuntu-latest
    timeout-minutes: 10

    container:
      image: semgrep/semgrep

    steps:
      - uses: actions/checkout@v6

      - name: Run Semgrep with auto config
        # `--config auto` pulls the rule packs Semgrep recommends for the
        # detected stack (TypeScript + Node + Hono).
        run: |
          semgrep ci \
            --config auto \
            --sarif --output=semgrep.sarif \
            || EXIT_CODE=$?
          # Don't fail the build on findings — Security tab will surface them.
          # Switch to `--severity ERROR` later if we want a hard gate.
          exit 0

      - name: Upload SARIF to Security tab
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: semgrep.sarif
